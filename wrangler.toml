# Wreathlight Worker. Free plan only (Workers Free + D1 Free). No secrets in this file:
# GEMINI_API_KEY and SESSION_SECRET are set with `wrangler secret put` (local dev: .dev.vars).
name = "wreathlight"
main = "src/worker/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Version preview URLs off: no non-production copies of the app are publicly reachable.
preview_urls = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "wreathlight-db"
database_id = "dae0718d-7bd9-446e-bf07-8a4f5cad7b9c"
migrations_dir = "migrations"

[vars]
# Confirmed with ListModels (Matthew's free-tier key) and the public pricing page, 2026-11-22.
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
AI_ENABLED = "true"
MAX_AI_CALLS_PER_CHURCH_PER_DAY = "20"
MAX_AI_CALLS_GLOBAL_PER_DAY = "300"

# Free plan allows 5 cron triggers. "0 * * * *" = hourly demo-church reset + ai_runs prompt purge
# (prompt text older than 7 days) + stale rate-limit rows. See scheduled() in src/worker/index.ts.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
