name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build client and validate the Worker bundle (free plan limit 3 MB gzip)
        run: |
          npm run build:client
          npx wrangler deploy --dry-run --outdir dist/worker

  no-verse-arcade:
    name: no-verse-arcade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-no-verse-arcade.sh

  e2e:
    name: playwright (wrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Local dev vars (mock AI, test clock; no real secrets)
        run: cp .dev.vars.example .dev.vars
      - name: Apply D1 migrations to the local (miniflare) database
        run: npx wrangler d1 migrations apply wreathlight-db --local
      - name: Seed the demo church locally
        run: npx tsx scripts/seed-demo.ts --local
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  lighthouse:
    name: lighthouse (mobile >= 90 on family + wreath)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Local dev vars (mock AI; no real secrets)
        run: cp .dev.vars.example .dev.vars
      - run: npm run build:client
      - run: npx wrangler d1 migrations apply wreathlight-db --local
      - run: npx tsx scripts/seed-demo.ts --local
      - name: Lighthouse CI (acceptance #14; config in lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  deploy:
    name: deploy (Cloudflare Workers + D1, free plan)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, no-verse-arcade, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply wreathlight-db --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
